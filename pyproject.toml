[project]
name = "road-defect"
version = "0.1.0"
description = "End-to-end MLOps pipeline for road surface defect detection"
readme = "README.md"
authors = [
    { name = "denyshorshkov", email = "denys.horshcov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mlflow>=3.16.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    # Declared directly (not just via ultralytics) so [tool.uv.sources] below
    # can route them to platform-specific wheel indexes.
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.155",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

# Windows (local dev) gets CUDA wheels for GPU training on the RTX 3050.
# Linux (Docker/Lambda) gets CPU-only wheels — the default PyPI Linux torch
# bundles NVIDIA libs and would add gigabytes to the Lambda image for nothing.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
