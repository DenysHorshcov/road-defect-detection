<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road Defect Detection</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e3e3e3;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111;
        --fg: #eee;
        --muted: #999;
        --line: #333;
        --accent: #60a5fa;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111;
      --fg: #eee;
      --muted: #999;
      --line: #333;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    .drop {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
    }
    .drop:hover { border-color: var(--accent); }
    .drop input { display: none; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .status { margin: 16px 0; color: var(--muted); min-height: 1.5em; }
    .status.error { color: #dc2626; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
    }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: middle;
    }
    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Road Defect Detection</h1>
    <p class="lead">Завантаж фото дороги, і модель знайде ями, тріщини та зношену розмітку.</p>

    <label class="drop">
      <input id="file" type="file" accept="image/*">
      <span class="btn">Обрати фото</span>
    </label>

    <div id="status" class="status"></div>
    <canvas id="canvas" hidden></canvas>

    <div class="legend">
      <span><i class="dot" style="background:#ef4444"></i>crack (тріщина)</span>
      <span><i class="dot" style="background:#f59e0b"></i>pothole (яма)</span>
      <span><i class="dot" style="background:#22c55e"></i>faded_lane_marking (розмітка)</span>
    </div>

    <footer>
      Модель: YOLO26n, натренована на RDD2022. mAP50 = 0.67.
      Перший запит після паузи може тривати до 30 с.
    </footer>
  </main>

  <script>
    const API = "https://3df26dtww4f3vvifrajnuligj40tpjfi.lambda-url.eu-central-1.on.aws";
    const COLORS = {
      crack: "#ef4444",
      pothole: "#f59e0b",
      faded_lane_marking: "#22c55e",
    };
    const CONFIDENCE = 0.25;
    const MAX_WIDTH = 860;

    const input = document.getElementById("file");
    const status = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function setStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle("error", isError);
    }

    function drawImage(img) {
      const scale = Math.min(1, MAX_WIDTH / img.width);
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.hidden = false;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return scale;
    }

    function drawBoxes(boxes, scale) {
      ctx.lineWidth = 3;
      ctx.font = "13px system-ui, sans-serif";
      for (const box of boxes) {
        const [x1, y1, x2, y2] = box.xyxy.map(v => v * scale);
        const color = COLORS[box.class_name] || "#2563eb";
        ctx.strokeStyle = color;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        const label = `${box.class_name} ${Math.round(box.confidence * 100)}%`;
        const w = ctx.measureText(label).width + 8;
        ctx.fillStyle = color;
        ctx.fillRect(x1, Math.max(0, y1 - 18), w, 18);
        ctx.fillStyle = "#fff";
        ctx.fillText(label, x1 + 4, Math.max(13, y1 - 5));
      }
    }

    input.addEventListener("change", async () => {
      const file = input.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => drawImage(img);
      img.src = url;

      setStatus("Аналізую фото…");
      const body = new FormData();
      body.append("file", file);

      try {
        const res = await fetch(`${API}/predict?confidence=${CONFIDENCE}`, {
          method: "POST",
          body,
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        img.onload = () => {
          const scale = drawImage(img);
          drawBoxes(data.boxes, scale);
        };
        if (img.complete) img.onload();

        const n = data.boxes.length;
        setStatus(n ? `Знайдено дефектів: ${n}` : "Дефектів не знайдено");
      } catch (err) {
        setStatus(`Помилка: ${err.message}. Спробуй ще раз через хвилину.`, true);
      }
    });
  </script>
</body>
</html>
